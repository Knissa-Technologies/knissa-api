services:
  postgres:
    image: postgres:17
    container_name: knissa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: knissa
      POSTGRES_USER: knissa
      POSTGRES_PASSWORD: knissa_dev_password

    ports:
      - "25432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knissa -d knissa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: knissa-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: knissa-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env.docker

    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data: