          description: Notification not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Marks a notification as read.
      operationId: markNotificationAsRead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification marked as read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Notification not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api-keys:
    post:
      tags:
        - API Keys
      summary: Create API key
      description: |
        Creates a new API key for the authenticated user's account.

        The raw secret is returned only during creation and must not be
        persisted by the server in plaintext.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          description: Invalid API key data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - API Keys
      summary: List API keys
      description: Returns API keys belonging to the authenticated user's account.
      operationId: listApiKeys
      responses:
        "200":
          description: API keys retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api-keys/{id}:
    get:
      tags:
        - API Keys
      summary: Get API key
      description: Returns an API key by ID.
      operationId: getApiKeyById
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: API key retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: API key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - API Keys
      summary: Delete API key
      description: Permanently deletes an API key.
      operationId: deleteApiKey
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: API key deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: API key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api-keys/{id}/revoke:
    patch:
      tags:
        - API Keys
      summary: Revoke API key
      description: Revokes an API key and records the revocation timestamp.
      operationId: revokeApiKey
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: API key revoked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: API key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema:
        type: string

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
            details:
              type: [object, "null"]
              additionalProperties: true
          required:
            - code
            - message
      required:
        - success
        - error
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        firstName:
          type: string
        lastName:
          type: string
        countryCode:
          type: string
          description: ISO country code, e.g. BR.
        phone:
          type: string
        languageCode:
          type: [string, "null"]
      required:
        - email
        - password
        - firstName
        - lastName
        - countryCode
        - phone
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        mfaRequired:
          type: boolean
          description: True if MFA verification must complete the login.
        accessToken:
          type: [string, "null"]
        refreshToken:
          type: [string, "null"]
        user:
          $ref: "#/components/schemas/UserResponseData"
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
      required:
        - currentPassword
        - newPassword
    SessionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        deviceName:
          type: [string, "null"]
        deviceType:
          type: string
          enum:
            - DESKTOP
            - LAPTOP
            - MOBILE
            - TABLET
            - SMART_TV
            - UNKNOWN
        operatingSystem:
          type: [string, "null"]
        browser:
          type: [string, "null"]
        isTrusted:
          type: boolean
        ipAddress:
          type: [string, "null"]
        countryCode:
          type: [string, "null"]
        city:
          type: [string, "null"]
        status:
          type: string
          enum:
            - ACTIVE
            - EXPIRED
            - REVOKED
        lastActivityAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/SessionData"
    MfaEnrollmentResponse:
      type: object
