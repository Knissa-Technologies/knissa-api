openapi: 3.1.1

info:
  title: Knissa API
  version: 1.0.0
  description: |
    REST API for the Knissa Financial Platform.

    Knissa provides secure financial infrastructure for:
    - Digital accounts
    - Multi-currency wallets
    - Transactions
    - Payments
    - Currency exchange
    - Merchant services
    - Notifications
    - API key management

    This OpenAPI specification describes the currently implemented
    backend API contract.

  contact:
    name: Knissa Engineering
    email: engineering@knissa.com

  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local Development

  - url: https://staging-api.knissa.com
    description: Staging

  - url: https://api.knissa.com
    description: Production

tags:
  - name: Authentication
    description: Registration, authentication, sessions and MFA

  - name: Users
    description: User management

  - name: Profiles
    description: Authenticated user profile

  - name: Accounts
    description: User account management

  - name: Wallets
    description: Multi-currency wallet operations

  - name: Transactions
    description: Financial transactions and transfers

  - name: Recipients
    description: Recipient management

  - name: Payments
    description: Payment operations and refunds

  - name: Payment Links
    description: Payment link lifecycle

  - name: Exchange
    description: Currency exchange quotes and conversions

  - name: Exchange Rates
    description: Exchange rate management

  - name: Merchants
    description: Merchant accounts and members

  - name: Compliance
    description: Compliance profiles and documents

  - name: Notifications
    description: In-app notifications

  - name: API Keys
    description: API credential management

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new Knissa user.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticates a user and creates an authenticated session.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email
      description: Verifies the user's email address.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid verification data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend email verification
      description: Resends the email verification request.
      operationId: resendEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Verification request processed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Generates a new access token using a refresh token.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "401":
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logs out the authenticated user.
      operationId: logoutUser
      responses:
        "200":
          description: Logout successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions:
    get:
      tags:
        - Authentication
      summary: Get active sessions
      description: Returns the authenticated user's active sessions.
      operationId: getSessions
      responses:
        "200":
          description: Sessions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions/{id}:
    delete:
      tags:
        - Authentication
      summary: Revoke session
      description: Revokes an authenticated user's session.
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Session revoked successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password:
    patch:
      tags:
        - Authentication
      summary: Change password
      description: Changes the authenticated user's password.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid password data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/enroll:
    post:
      tags:
        - Authentication
      summary: Enroll MFA
      description: Starts MFA enrollment for the authenticated user.
      operationId: enrollMfa
      responses:
        "200":
          description: MFA enrollment initiated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollmentResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/verify:
    post:
      tags:
        - Authentication
      summary: Verify MFA
      description: Verifies the MFA code for the authenticated user.
      operationId: verifyMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: MFA verification successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Invalid MFA code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/verify-login:
    post:
      tags:
        - Authentication
      summary: Verify MFA during login
      description: Verifies the MFA challenge generated during login.
      operationId: verifyMfaLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginVerifyRequest"
      responses:
        "200":
          description: MFA login verification successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid MFA verification data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: MFA verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Returns users available to administrators and support users.
      operationId: listUsers
      responses:
        "200":
          description: Users retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns a user by UUID. Requires administrative or support access.
      operationId: getUserById
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: User retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Users
      summary: Update user
      description: Updates a user. Requires administrator access.
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes a user. Requires administrator access.
      operationId: deleteUser
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: User deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles/me:
    get:
      tags:
        - Profiles
      summary: Get my profile
      description: Returns the authenticated user's profile.
      operationId: getMyProfile
      responses:
        "200":
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Profiles
      summary: Update my profile
      description: Updates the authenticated user's profile.
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts:
    get:
      tags:
        - Accounts
      summary: List my accounts
      description: Returns accounts belonging to the authenticated user.
      operationId: listMyAccounts
      responses:
        "200":
          description: Accounts retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get account by ID
      description: Returns an account belonging to the authenticated user.
      operationId: getAccountById
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Account retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Accounts
      summary: Update account
      description: Updates an account belonging to the authenticated user.
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets:
    get:
      tags:
        - Wallets
      summary: List my wallets
      description: Returns wallets belonging to the authenticated user's accounts.
      operationId: listMyWallets
      responses:
        "200":
          description: Wallets retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/{id}:
    get:
      tags:
        - Wallets
      summary: Get wallet by ID
      description: Returns a wallet belonging to the authenticated user.
      operationId: getWalletById
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Wallet retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Wallet not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions:
    get:
      tags:
        - Transactions
      summary: List my transactions
      description: Returns transactions available to the authenticated user.
      operationId: listMyTransactions
      responses:
        "200":
          description: Transactions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      description: Returns a transaction belonging to the authenticated user.
      operationId: getTransactionById
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Transaction retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/transfer:
    post:
      tags:
        - Transactions
      summary: Create internal transfer
      description: Transfers funds between eligible Knissa wallets.
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "201":
          description: Transfer created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Invalid transfer request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Wallet or recipient not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/deposit:
    post:
      tags:
        - Transactions
      summary: Create test deposit
      description: |
        Creates a test deposit for development or administrative testing.

        This endpoint is restricted to administrators and is not intended
        for production financial deposits.
      operationId: createTestDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepositRequest"
      responses:
        "201":
          description: Test deposit created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Invalid deposit request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recipients:
    get:
      tags:
        - Recipients
      summary: List my recipients
      description: Returns recipients belonging to the authenticated user.
      operationId: listRecipients
      responses:
        "200":
          description: Recipients retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Recipients
      summary: Create recipient
      description: Creates a recipient for the authenticated user.
      operationId: createRecipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipientRequest"
      responses:
        "201":
          description: Recipient created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientResponse"
        "400":
          description: Invalid recipient data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recipients/{id}:
    get:
      tags:
        - Recipients
      summary: Get recipient by ID
      description: Returns a recipient belonging to the authenticated user.
      operationId: getRecipientById
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Recipient retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recipient not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Recipients
      summary: Update recipient
      description: Updates a recipient belonging to the authenticated user.
      operationId: updateRecipient
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipientRequest"
      responses:
        "200":
          description: Recipient updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientResponse"
        "400":
          description: Invalid recipient data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recipient not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments:
    post:
      tags:
        - Payments
      summary: Create payment
      description: Creates a payment for the authenticated user.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Invalid payment request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Payments
      summary: List my payments
      description: Returns payments associated with the authenticated user.
      operationId: listMyPayments
      responses:
        "200":
          description: Payments retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{paymentId}:
    get:
      tags:
        - Payments
      summary: Get payment by ID
      description: Returns a payment by its identifier.
      operationId: getPaymentById
      parameters:
        - name: paymentId
          in: path
          required: true
          description: Payment UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          description: Unauthorized.
