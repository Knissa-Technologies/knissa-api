openapi: 3.1.1

info:
  title: Knissa API
  version: 1.0.0

  description: |
    REST API for the Knissa Financial Platform.

    Knissa provides secure financial services including:

    - Authentication
    - Wallet Management
    - Payments
    - Currency Exchange
    - Multi-Currency Wallets
    - Merchant Accounts
    - Future Open Finance Integrations

  contact:
    name: Knissa Engineering
    email: engineering@knissa.com

  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development

  - url: https://staging-api.knissa.com
    description: Staging

  - url: https://api.knissa.com
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: User registration and authentication

  - name: Users
    description: User management

  - name: Wallets
    description: Wallet operations

  - name: Payments
    description: Payment operations

  - name: Exchange
    description: Currency exchange

  - name: Exchange Rates
    description: Exchange rate management

  - name: Countries
    description: Supported countries

  - name: Currencies
    description: Supported currencies

  - name: Ledger
    description: Immutable financial ledger

  - name: Merchants
    description: Merchant accounts

  - name: Audit
    description: Audit and compliance

paths:
  /auth/register:
    post:
      tags:
        - Authentication

      summary: Register a new user

      description: Creates a new Knissa account.

      operationId: registerUser

      security: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"

      responses:
        "201":
          description: User successfully registered.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: Email already registered.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags:
        - Authentication

      summary: Authenticate user

      description: |
        Authenticates a user and returns
        an access token.

      operationId: loginUser

      security: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"

      responses:
        "200":
          description: Authentication successful.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Invalid credentials.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    post:
      tags:
        - Users

      summary: Create a new user

      description: Creates a new platform user.

      operationId: createUser

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"

      responses:
        "201":
          description: User successfully created.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: Email already exists.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Users

      summary: List users

      description: Returns all registered users.

      operationId: listUsers

      responses:
        "200":
          description: Users retrieved successfully.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

        "401":
          description: Unauthorized.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      tags:
        - Users

      summary: Get authenticated user

      description: Returns the authenticated user's profile.

      operationId: currentUser

      responses:
        "200":
          description: User profile.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "401":
          description: Unauthorized.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/open-account:
    post:
      tags:
        - Wallets

      summary: Open wallet

      description: Creates a wallet for a specific currency.

      operationId: openWalletAccount

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenWalletRequest"

      responses:
        "201":
          description: Wallet successfully created.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: Wallet already exists.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/deposit:
    post:
      tags:
        - Wallets

      summary: Deposit funds

      description: Deposits money into a wallet.

      operationId: depositFunds

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"

      responses:
        "200":
          description: Deposit completed.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Business rule violation.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/withdraw:
    post:
      tags:
        - Wallets

      summary: Withdraw funds

      description: Withdraws money from a wallet.

      operationId: withdrawFunds

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"

      responses:
        "200":
          description: Withdrawal completed.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Insufficient balance.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/transfer:
    post:
      tags:
        - Wallets

      summary: Transfer funds

      description: Transfers money between wallets.

      operationId: transferFunds

      parameters:
        - name: Idempotency-Key
          in: header
          required: true

          schema:
            type: string

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"

      responses:
        "200":
          description: Transfer completed successfully.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Insufficient balance.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/{accountNumber}/statement:
    get:
      tags:
        - Wallets

      summary: Wallet statement

      description: Returns the transaction history for a wallet.

      operationId: walletStatement

      parameters:
        - name: accountNumber
          in: path
          required: true

          schema:
            type: string

      responses:
        "200":
          description: Statement successfully retrieved.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementResponse"

        "404":
          description: Wallet not found.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments:
    post:
      tags:
        - Payments

      summary: Create payment

      description: Creates and processes a payment transaction.

      operationId: createPayment

      parameters:
        - name: Idempotency-Key
          in: header
          required: true

          schema:
            type: string

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"

      responses:
        "201":
          description: Payment created successfully.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Business rule violation.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}:
    get:
      tags:
        - Payments

      summary: Get payment details

      description: Returns a payment by its identifier.

      operationId: getPaymentById

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: Payment found.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

        "404":
          description: Payment not found.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/history:
    get:
      tags:
        - Payments

      summary: Payment history

      description: Returns all payments of the authenticated user.

      operationId: paymentHistory

      responses:
        "200":
          description: Payment history.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"

  /exchange:
    post:
      tags:
        - Exchange

      summary: Exchange currencies

      description: Converts money from one wallet currency to another.

      operationId: exchangeCurrency

      parameters:
        - name: Idempotency-Key
          in: header
          required: true

          schema:
            type: string

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRequest"

      responses:
        "200":
          description: Exchange completed successfully.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "422":
          description: Insufficient balance.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exchange/history:
    get:
      tags:
        - Exchange

      summary: Exchange history

      description: Returns all exchange operations.

      operationId: exchangeHistory

      responses:
        "200":
          description: Exchange history.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeListResponse"

  /exchange-rates:
    post:
      tags:
        - Exchange Rates

      summary: Create exchange rate

      description: Creates a new exchange rate.

      operationId: createExchangeRate

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateRequest"

      responses:
        "201":
          description: Exchange rate created.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"

        "400":
          description: Validation error.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Exchange Rates

      summary: List exchange rates

      description: Returns all configured exchange rates.

      operationId: listExchangeRates

      responses:
        "200":
          description: Exchange rates list.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateListResponse"

  /countries:
    get:
      tags:
        - Countries

      summary: List countries

      description: Returns all countries supported by the platform.

      operationId: listCountries

      responses:
        "200":
          description: Countries retrieved successfully.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryListResponse"

        "401":
          description: Unauthorized.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /currencies:
    get:
      tags:
        - Currencies

      summary: List currencies

      description: Returns all supported currencies.

      operationId: listCurrencies

      responses:
        "200":
          description: Currencies retrieved successfully.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyListResponse"

        "401":
          description: Unauthorized.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object

      properties:
        success:
          type: boolean
          example: false

        error:
          type: object

          properties:
            code:
              type: string
              example: VALIDATION_ERROR

            message:
              type: string
              example: Validation failed.

            details:
              type: array

              items:
                type: string

    Pagination:
      type: object

      properties:
        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 20

        total:
          type: integer
          example: 150

        pages:
          type: integer
          example: 8

    ApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: Operation completed successfully.

    RegisterRequest:

    RegisterRequest:
      type: object

      required:
        - name
        - email
        - password

      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Jean Joseph

        email:
          type: string
          format: email
          example: jean@email.com

        password:
          type: string
          format: password
          minLength: 8
          example: "12345678"

    RegisterResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/User"

    LoginRequest:
      type: object

      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email

        password:
          type: string
          format: password

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object

          properties:
            data:
              type: object

              properties:
                user:
                  $ref: "#/components/schemas/User"

                accessToken:
                  type: string

                expiresIn:
                  type: integer
                  example: 3600

    User:
      type: object

      properties:
        id:
          type: string
          format: uuid

        name:
          type: string

        email:
          type: string
          format: email

        role:
          type: string
          enum:
            - USER
            - ADMIN
            - MERCHANT

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      $ref: "#/components/schemas/RegisterRequest"

    UserResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object

          properties:
            data:
              $ref: "#/components/schemas/User"

    UserListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object

          properties:
            pagination:
              $ref: "#/components/schemas/Pagination"

            data:
              type: array

              items:
                $ref: "#/components/schemas/User"

    Wallet:
      type: object

      properties:
        id:
          type: string
          format: uuid

        accountNumber:
          type: string

        balance:
          type: number
          format: double

        currency:
          type: string

        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
            - CLOSED

        createdAt:
          type: string
          format: date-time

    WalletResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            data:
              $ref: "#/components/schemas/Wallet"

    OpenWalletRequest:
      type: object

      required:
        - countryId
        - currencyId

      properties:
        countryId:
          type: string
          format: uuid

        currencyId:
          type: string
          format: uuid

    DepositRequest:
      type: object

      required:
        - accountNumber
        - amount

      properties:
        accountNumber:
          type: string

        amount:
          type: number
          format: double

    WithdrawRequest:
      type: object

      required:
        - accountNumber
        - amount

      properties:
        accountNumber:
          type: string

        amount:
          type: number
          format: double

    TransferRequest:
      type: object

      required:
        - fromAccount
        - toAccount
        - amount

      properties:
        fromAccount:
          type: string

        toAccount:
          type: string

        amount:
          type: number
          format: double

    TransferResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            transactionId:
              type: string
              format: uuid

            data:
              $ref: "#/components/schemas/Wallet"

    StatementResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            data:
              type: array

              items:
                type: object

                properties:
                  id:
                    type: string
                    format: uuid

                  type:
                    type: string

                  amount:
                    type: number
                    format: double

                  createdAt:
                    type: string
                    format: date-time

    Payment:
      type: object

      properties:
        id:
          type: string
          format: uuid

        transactionId:
          type: string
          format: uuid

        fromAccount:
          type: string

        toAccount:
          type: string

        amount:
          type: number
          format: double

        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - COMPLETED
            - FAILED
            - CANCELLED

        createdAt:
          type: string
          format: date-time

    PaymentRequest:
      type: object

      required:
        - fromAccount
        - toAccount
        - amount

      properties:
        fromAccount:
          type: string

        toAccount:
          type: string

        amount:
          type: number
          format: double

        description:
          type: string

    PaymentResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            data:
              $ref: "#/components/schemas/Payment"

    PaymentListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            pagination:
              $ref: "#/components/schemas/Pagination"

            data:
              type: array

              items:
                $ref: "#/components/schemas/Payment"

    Exchange:
      type: object

      properties:
        id:
          type: string
          format: uuid

        fromCurrency:
          type: string

        toCurrency:
          type: string

        amount:
          type: number

        convertedAmount:
          type: number

        exchangeRate:
          type: number

        createdAt:
          type: string
          format: date-time

    ExchangeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            data:
              $ref: "#/components/schemas/Exchange"

    ExchangeListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            pagination:
              $ref: "#/components/schemas/Pagination"

            data:
              type: array

              items:
                $ref: "#/components/schemas/Exchange"

    ExchangeRate:
      type: object

      properties:
        id:
          type: string
          format: uuid

        fromCurrency:
          type: string
          example: BRL

        toCurrency:
          type: string
          example: USD

        rate:
          type: number
          format: double
          example: 5.42

        createdAt:
          type: string
          format: date-time

    ExchangeRateRequest:
      type: object

      required:
        - fromCurrency
        - toCurrency
        - rate

      properties:
        fromCurrency:
          type: string
          example: BRL

        toCurrency:
          type: string
          example: USD

        rate:
          type: number
          format: double

    ExchangeRateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            data:
              $ref: "#/components/schemas/ExchangeRate"

    ExchangeRateListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            pagination:
              $ref: "#/components/schemas/Pagination"

            data:
              type: array

              items:
                $ref: "#/components/schemas/ExchangeRate"

    Country:
      type: object

      properties:
        id:
          type: string
          format: uuid

        name:
          type: string
          example: Brazil

        code:
          type: string
          example: BR

        currency:
          type: string
          example: BRL

    CountryListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            pagination:
              $ref: "#/components/schemas/Pagination"

            data:
              type: array

              items:
                $ref: "#/components/schemas/Country"

    Currency:
      type: object

      properties:
        id:
          type: string
          format: uuid

        name:
          type: string
          example: Brazilian Real

        code:
          type: string
          example: BRL

        symbol:
          type: string
          example: R$

    CurrencyListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"

        - type: object

          properties:
            pagination:
              $ref: "#/components/schemas/Pagination"

            data:
              type: array

              items:
                $ref: "#/components/schemas/Currency"
